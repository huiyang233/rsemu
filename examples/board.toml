target = "STM32F407"
firmware = "../firmware/rtthread.bin"
load_addr = 0x08000000
cycle_scale = 1

[[peripherals]]
type = "uart"
usart = "USART1"
tx = { port = "A", pin = 9 }
rx = { port = "A", pin = 10 }

[[peripherals]]
type = "st7789_spi"
width = 240
height = 320
spi_base = 0x40013000
cs = { port = "A", pin = 4 }
dc = { port = "A", pin = 3 }

[[peripherals]]
type = "led"
pin = { port = "F", pin = 12 }
active_low = true
